name: Daily Build

on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
    steps:
      - uses: actions/checkout@v4
      - name: Check for recent commits
        id: check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -n "$(git log --since='24 hours ago' --oneline)" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "过去 24 小时无新提交，跳过构建"
          fi

  build:
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web-ui/pnpm-lock.yaml

      - name: Install web-ui dependencies
        working-directory: web-ui
        run: pnpm install --frozen-lockfile

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Apply custom mods
        run: |
          set -e
          echo "=== Applying custom mods ==="

          # 1. 开启 R8 代码压缩与优化（实现 7 DEX 变 3 DEX）
          # 定位到 build.gradle.kts 中的 release {} 块，将其中的 false 修改为 true
          GRADLE_FILE="app/build.gradle.kts"
          if [ -f "$GRADLE_FILE" ]; then
            sed -i '/release {/,/}/s/isMinifyEnabled = false/isMinifyEnabled = true/' "$GRADLE_FILE"
            sed -i '/release {/,/}/s/isShrinkResources = false/isShrinkResources = true/' "$GRADLE_FILE"
            echo "[OK] Enabled R8 Minify & Shrink in app/build.gradle.kts"
          else
            echo "[Error] app/build.gradle.kts not found"
            exit 1
          fi

          # 2. 修改 ChatService.kt：取消 enabledSkills 是否为空的检查，确保入口强制开启
          # 将 "assistant.enabledSkills.isNotEmpty()" 直接替换为 "true"
          CHAT_FILE="app/src/main/java/me/rerere/rikkahub/service/ChatService.kt"
          if [ -f "$CHAT_FILE" ]; then
            sed -i 's/assistant\.enabledSkills\.isNotEmpty()/true/g' "$CHAT_FILE"
            echo "[OK] Patched ChatService.kt: forced skill entry"
          else
            echo "[Error] ChatService.kt not found"
            exit 1
          fi

          # 3. 修改 SkillsTools.kt：删除 filter 过滤，将所有已装技能赋予 available
          # 将 "val available = allSkills.filter { it.name in enabledSkills }" 替换为 "val available = allSkills"
          SKILL_TOOLS="app/src/main/java/me/rerere/rikkahub/data/ai/tools/SkillsTools.kt"
          if [ -f "$SKILL_TOOLS" ]; then
            sed -i 's/val available = allSkills\.filter { it\.name in enabledSkills }/val available = allSkills/g' "$SKILL_TOOLS"
            echo "[OK] Patched SkillsTools.kt: bypassed enabledSkills filter"
          else
            echo "[Error] SkillsTools.kt not found"
            exit 1
          fi

          # 4. 移除 Firebase (保持你原有的逻辑，删除 Firebase 依赖和代码)
          echo "=== Removing Firebase ==="
          sed -i '/id("com\.google\.gms\.google-services")/d' app/build.gradle.kts || true
          sed -i '/libs\.firebase/d' app/build.gradle.kts || true
          sed -i '/firebase/d' gradle/libs.versions.toml || true
          sed -i '/google-services/d' gradle/libs.versions.toml || true
          sed -i '/libs\.plugins\.google/d' build.gradle.kts || true
          sed -i '/libs\.plugins\.firebase/d' build.gradle.kts || true

          find app/src/main/java -type f -name "*.kt" -exec sed -i '/import com\.google\.firebase/d' {} +
          find app/src/main/java -type f -name "*.kt" -exec sed -i 's/, private val analytics: FirebaseAnalytics//' {} +
          find app/src/main/java -type f -name "*.kt" -exec sed -i '/analytics\.logEvent/d' {} +
          find app/src/main/java -type f -name "*.kt" -exec sed -i '/Firebase/d' {} +
          find app/src/main/java -type f -name "*.kt" -exec sed -i '/FirebaseAnalytics/d' {} +

          sed -i '/single.*Firebase/,/}/d' app/src/main/java/me/rerere/rikkahub/di/AppModule.kt || true
          sed -i '/single.*Crashlytics/,/}/d' app/src/main/java/me/rerere/rikkahub/di/AppModule.kt || true

          VIEWMODEL_MODULE="app/src/main/java/me/rerere/rikkahub/di/ViewModelModule.kt"
          if [ -f "$VIEWMODEL_MODULE" ]; then
            sed -i '/Firebase/d' "$VIEWMODEL_MODULE"
            sed -i '/analytics\s*=/d' "$VIEWMODEL_MODULE"
            echo "[OK] Removed Firebase analytics injection"
          fi
          echo "[OK] Firebase removed"

          # 5. 技能包塞进 assets
          mkdir -p app/src/main/assets/skills
          if [ -d "mod/skills" ]; then
            cp -r mod/skills/* app/src/main/assets/skills/
            echo "[OK] Skills copied to assets/skills/"
          fi

          # 6. 复制 BundledSkillInstaller.java
          INSTALLER_PATH="app/src/main/java/me/rerere/rikkahub/BundledSkillInstaller.java"
          if [ -f "mod/BundledSkillInstaller.java" ]; then
            mkdir -p app/src/main/java/me/rerere/rikkahub
            cp mod/BundledSkillInstaller.java "$INSTALLER_PATH"
            echo "[OK] BundledSkillInstaller.java copied"
          fi

          # 7. 改 RikkaHubApp.kt: super.onCreate() 后插入 install 调用
          APP_FILE="app/src/main/java/me/rerere/rikkahub/RikkaHubApp.kt"
          if [ -f "$APP_FILE" ]; then
            if ! grep -q "BundledSkillInstaller.install" "$APP_FILE"; then
              sed -i '/super\.onCreate()/a \        me.rerere.rikkahub.BundledSkillInstaller.install(this)' "$APP_FILE"
              echo "[OK] Injected install() into RikkaHubApp.kt"
            else
              echo "[Skip] install() already exists in RikkaHubApp.kt"
            fi
          fi

          # 8. 修复 baselineprofile 插件版本冲突并移除构建入口
          BASELINE_FILE="app/baselineprofile/build.gradle.kts"
          if [ -f "$BASELINE_FILE" ]; then
            sed -i 's/id("com.android.test") version "[^"]*"/id("com.android.test")/' "$BASELINE_FILE"
            echo "[OK] Fixed baselineprofile com.android.test version"
          fi

          sed -i '/include(":app:baselineprofile")/d' settings.gradle.kts || true
          sed -i '/baselineProfile(project(":app:baselineprofile"))/d' app/build.gradle.kts || true
          sed -i '/alias(libs.plugins.baselineprofile)/d' app/build.gradle.kts || true
          sed -i '/alias(libs.plugins.android.test)/d' build.gradle.kts || true
          sed -i '/alias(libs.plugins.baselineprofile)/d' build.gradle.kts || true

          # 9. 防 R8 误删自定义类的 Keep 规则
          echo -e "\n-keep class me.rerere.rikkahub.BundledSkillInstaller { *; }" >> app/proguard-rules.pro
          echo "-keep class me.rerere.rikkahub.data.files.SkillMetadata { *; }" >> app/proguard-rules.pro
          echo "[OK] Added proguard keep rules"

          # 10. 修改 Assistant.kt: 在数据类末尾注入 deletable 属性
          ASSISTANT_MODEL="app/src/main/java/me/rerere/rikkahub/data/model/Assistant.kt"
          if [ -f "$ASSISTANT_MODEL" ]; then
            # 在 allowConversationPromptInjection 后面追加 deletable
            sed -i 's/val allowConversationPromptInjection: Boolean = false/val allowConversationPromptInjection: Boolean = false,\n    val deletable: Boolean = true/g' "$ASSISTANT_MODEL"
            echo "[OK] Injected 'deletable' property into Assistant.kt"
          fi

          # 11. 全局解开助手的删除按钮 UI 限制 (强力版)
          # A. 修改 AssistantPage.kt：强制显示自带助手的删除菜单
          ASSISTANT_PAGE="app/src/main/java/me/rerere/rikkahub/ui/pages/assistant/AssistantPage.kt"
          if [ -f "$ASSISTANT_PAGE" ]; then
            # 逻辑：将判断 "是否为默认助手" 的 contains 检查强制改为 false
            # 即使 ID 在默认列表里，结果也是 false，从而 !false 为 true，显示按钮
            sed -i 's/DEFAULT_ASSISTANTS_IDS\.contains([^)]*)/false/g' "$ASSISTANT_PAGE"

            # 逻辑：有些版本可能还判断了 "不能删除当前正在使用的助手"
            # 我们将 assistant.id == settings.assistantId 这种判断也废掉
            sed -i 's/assistant\.id == settings\.assistantId/false/g' "$ASSISTANT_PAGE"
            echo "[OK] Forced Delete button for default assistants in AssistantPage.kt"
          fi

          # B. 修改模型属性和通用判断 (确保其他可能的 UI 路径也放行)
          find app/src/main/java -type f -name "*.kt" -exec sed -i 's/it\.deletable/true/g' {} +
          find app/src/main/java -type f -name "*.kt" -exec sed -i 's/assistant\.deletable/true/g' {} +

          # C. 绕过助手列表中的“当前助手锁定”逻辑
          find app/src/main/java/me/rerere/rikkahub/ui -type f -name "*.kt" -exec sed -i 's/assistant\.id != settings\.assistantId/true/g' {} +
          find app/src/main/java/me/rerere/rikkahub/ui -type f -name "*.kt" -exec sed -i 's/it\.id != settings\.assistantId/true/g' {} +

          # 12. 保证修改过的数据类在 R8 下不被破坏
          echo "-keep class me.rerere.rikkahub.data.model.Assistant { *; }" >> app/proguard-rules.pro
          echo "-keepclassmembers class me.rerere.rikkahub.data.model.Assistant { *; }" >> app/proguard-rules.pro
          echo "[OK] Added Assistant model to proguard keep rules"

          echo "=== Mod apply done ==="
          echo "=== Checking Firebase leftovers ==="
          grep -R "Firebase\|analytics =" app/src/main/java || true

      - name: Build Release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rikkahub-release
          path: app/build/outputs/apk/release/app-release.apk

      - name: Publish nightly prerelease
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: nightly
          name: Nightly Build
          prerelease: true
          body: |
            自动每日构建 `${{ github.sha }}`
            Mod: 内置 skills + 强制启用全部技能 + 强开助手删除按钮 (含 DEX 精简合并)
          files: app/build/outputs/apk/release/*.apk
