name: Unsigned Release
on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Local Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Configure Git Identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # Step 1: 备份保护文件，同步上游仓库并还原保护文件
      - name: Sync Upstream with Protected Files
        id: sync
        run: |
          set -e
          echo "=== Step 1: Backup protected files ==="
          mkdir -p /tmp/protected_backup
          [ -f ".github/workflows/daily-build.yml" ] && cp --parents .github/workflows/daily-build.yml /tmp/protected_backup/ || true
          [ -f "README.md" ] && cp --parents README.md /tmp/protected_backup/ || true
          [ -f "build.gradle.kts" ] && cp --parents build.gradle.kts /tmp/protected_backup/ || true
          [ -f "app/google-services.json" ] && cp --parents app/google-services.json /tmp/protected_backup/ || true
          [ -d "mod" ] && cp -r mod /tmp/protected_backup/ || true
          echo "=== Fetching and merging upstream ==="
          git remote add upstream https://github.com/rikkahub/rikkahub.git || true
          git fetch upstream master || git fetch upstream main
          UPSTREAM_BRANCH="upstream/master"
          git rev-parse --verify "$UPSTREAM_BRANCH" >/dev/null 2>&1 || UPSTREAM_BRANCH="upstream/main"
          git merge "$UPSTREAM_BRANCH" --no-commit --no-ff -X ours
          echo "=== Restoring protected files ==="
          [ -f "/tmp/protected_backup/.github/workflows/daily-build.yml" ] && cp /tmp/protected_backup/.github/workflows/daily-build.yml .github/workflows/daily-build.yml || true
          [ -f "/tmp/protected_backup/README.md" ] && cp /tmp/protected_backup/README.md README.md || true
          [ -f "/tmp/protected_backup/build.gradle.kts" ] && cp /tmp/protected_backup/build.gradle.kts build.gradle.kts || true
          [ -f "/tmp/protected_backup/app/google-services.json" ] && cp /tmp/protected_backup/app/google-services.json app/google-services.json || true
          if [ -d "/tmp/protected_backup/mod" ]; then
            rm -rf mod
            cp -r /tmp/protected_backup/mod mod
          fi
          git add .
          if ! git diff --staged --quiet; then
            git commit -m "sync: merge upstream with protected local files"
            git push origin master || git push origin main
            echo "has_sync_changes=true" >> $GITHUB_OUTPUT
          else
            echo "No new changes from upstream merge."
            echo "has_sync_changes=false" >> $GITHUB_OUTPUT
          fi

      # Step 2: 获取版本号与 Tag 判定
      - name: Extract Version Name & Check Tag
        id: version
        run: |
          VERSION_NAME=$(grep -E 'versionName\s*=' app/build.gradle.kts | head -1 | sed -E 's/.*versionName\s*=\s*"([^"]+)".*/\1/')
          if [ -z "$VERSION_NAME" ]; then
            echo "Cannot find versionName"
            exit 1
          fi
          TAG_NAME="v${VERSION_NAME}"
          echo "version_name=${VERSION_NAME}" >> $GITHUB_OUTPUT
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
          if git rev-parse "$TAG_NAME" >/dev/null 2>&1 || git ls-remote --tags origin | grep -q "refs/tags/${TAG_NAME}"; then
            echo "tag_exists=true" >> $GITHUB_OUTPUT
            echo "Tag ${TAG_NAME} already exists."
          else
            echo "tag_exists=false" >> $GITHUB_OUTPUT
            echo "New Tag ${TAG_NAME} will be created."
          fi

      # Step 3: 确定是否继续编译
      - name: Check Should Build
        id: check_build
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ steps.version.outputs.tag_exists }}" = "false" ] || [ "${{ steps.sync.outputs.has_sync_changes }}" = "true" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "无新提交且版本号标签未更新，跳过构建。"
          fi

      - name: Set up JDK 17
        if: steps.check_build.outputs.should_build == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up pnpm
        if: steps.check_build.outputs.should_build == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node 22
        if: steps.check_build.outputs.should_build == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web-ui/pnpm-lock.yaml

      - name: Install web-ui dependencies
        if: steps.check_build.outputs.should_build == 'true'
        working-directory: web-ui
        run: pnpm install --frozen-lockfile

      - name: Gradle cache
        if: steps.check_build.outputs.should_build == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      # Step 4: 移除 BaselineProfile 模块
      - name: Remove BaselineProfile Module
        if: steps.check_build.outputs.should_build == 'true'
        run: |
          echo "=== Disabling BaselineProfile Module ==="
          sed -i '/include(":app:baselineprofile")/d' settings.gradle.kts || true
          sed -i '/baselineProfile(project(":app:baselineprofile"))/d' app/build.gradle.kts || true
          sed -i '/alias(libs\.plugins\.baselineprofile)/d' app/build.gradle.kts || true
          sed -i '/alias(libs\.plugins\.baselineprofile)/d' build.gradle.kts || true
          sed -i '/alias(libs\.plugins\.android\.test)/d' build.gradle.kts || true

      # Step 5: 修改 app/build.gradle.kts 与注入 Custom Mods
      - name: Modify app/build.gradle.kts & Apply Custom Mods
        if: steps.check_build.outputs.should_build == 'true'
        run: |
          echo "=== 1. Modifying app/build.gradle.kts with Python ==="
          python3 << 'PYEOF'
          import re
          gradle_path = "app/build.gradle.kts"
          with open(gradle_path, "r", encoding="utf-8") as f:
              content = f.read()
          # 1. plugins 删除
          content = re.sub(r'\s*alias\(libs\.plugins\.google\.services\)', '', content)
          content = re.sub(r'\s*alias\(libs\.plugins\.firebase\.crashlytics\)', '', content)
          # 2. 删除注释
          content = re.sub(r'\s*// AppBundle tasks usually contain "bundle" in their name', '', content)
          content = re.sub(r'\s*//noinspection WrongGradleMethod', '', content)
          # 3. signingConfigs 整段删除
          content = re.sub(r'\n\s*signingConfigs\s*\{[\s\S]*?\n\s*\}', '', content)
          # 4. buildTypes 清理
          content = re.sub(r'\s*signingConfig\s*=\s*signingConfigs\.getByName\("release"\)', '', content)
          content = re.sub(r'\s*optimization\s*\{[\s\S]*?\}', '', content)
          # 强制开启混淆
          if "isMinifyEnabled" in content:
              content = re.sub(r'isMinifyEnabled\s*=\s*(true|false)', 'isMinifyEnabled = true', content)
          else:
              content = re.sub(r'(release\s*\{)', r'\1\n isMinifyEnabled = true', content, count=1)
          if "isShrinkResources" in content:
              content = re.sub(r'isShrinkResources\s*=\s*(true|false)', 'isShrinkResources = true', content)
          else:
              content = re.sub(r'(release\s*\{)', r'\1\n isShrinkResources = true', content, count=1)
          # 添加 proguardFiles
          if "proguardFiles(" not in content:
              print("[INFO] Adding proguardFiles")
              proguard_block = '\n proguardFiles(\n getDefaultProguardFile("proguard-android-optimize.txt"),\n "proguard-rules.pro"\n )'
              content = re.sub(r'(release\s*\{)', r'\1' + proguard_block, content, count=1)
          else:
              print("[OK] proguardFiles already exists")
          # 5. sourceSets 删除
          content = re.sub(r'\n\s*sourceSets\s*\{[\s\S]*?\n\s*\}', '', content)
          # 6. Firebase 清理
          content = re.sub(r'\s*// Firebase', '', content)
          content = re.sub(r'\s*implementation\(platform\(libs\.firebase\.bom\)\)', '', content)
          content = re.sub(r'\s*implementation\(libs\.firebase\.crashlytics\)', '', content)
          content = re.sub(r'\s*implementation\(libs\.firebase\.analytics\)', '', content)
          with open(gradle_path, "w", encoding="utf-8") as f:
              f.write(content)
          print("[OK] app/build.gradle.kts modified successfully.")
          PYEOF
          echo "=== 2. Clean Firebase Residues ==="
          find app/src/main/java -name "*.kt" -exec sed -i '/import com\.google\.firebase/d' {} + || true
          find app/src/main/java -name "*.kt" -exec sed -i '/FirebaseAnalytics/d' {} + || true
          find app/src/main/java -name "*.kt" -exec sed -i '/Firebase/d' {} + || true
          sed -i '/Firebase/d' app/src/main/java/me/rerere/rikkahub/di/AppModule.kt || true
          sed -i '/analytics/d' app/src/main/java/me/rerere/rikkahub/di/AppModule.kt || true
          sed -i '/Firebase/d' app/src/main/java/me/rerere/rikkahub/di/ViewModelModule.kt || true
          sed -i '/analytics/d' app/src/main/java/me/rerere/rikkahub/di/ViewModelModule.kt || true
          sed -i '/Firebase/d' app/src/main/java/me/rerere/rikkahub/ui/pages/chat/ChatVM.kt || true
          sed -i '/analytics/d' app/src/main/java/me/rerere/rikkahub/ui/pages/chat/ChatVM.kt || true
          echo "=== 3. Copy Builtin Skills & Installer ==="
          mkdir -p app/src/main/assets/skills
          if [ -d "mod/skills" ]; then
            cp -rf mod/skills/* app/src/main/assets/skills/
            echo "[OK] skills copied"
            find app/src/main/assets/skills -maxdepth 2 -type f
          else
            echo "[WARN] mod/skills missing"
          fi
          echo "=== Copy BundledSkillInstaller ==="
          if [ -f "mod/BundledSkillInstaller.java" ]; then
            mkdir -p app/src/main/java/me/rerere/rikkahub
            cp -f mod/BundledSkillInstaller.java \
              app/src/main/java/me/rerere/rikkahub/BundledSkillInstaller.java
            echo "[OK] BundledSkillInstaller copied"
          else
            echo "[WARN] BundledSkillInstaller missing"
          fi
          echo "=== Replace UpdateChecker.kt ==="
          if [ -f "mod/UpdateChecker.kt" ]; then
            TARGET="app/src/main/java/me/rerere/rikkahub/utils/UpdateChecker.kt"
            mkdir -p "$(dirname "$TARGET")"
            cp -f mod/UpdateChecker.kt "$TARGET"
            echo "[OK] UpdateChecker.kt replaced → 使用自己的 GitHub Releases"
            grep -n "api.github.com/repos/klcb2010" "$TARGET" || echo "[WARN] API URL 可能不对"
          else
            echo "[WARN] mod/UpdateChecker.kt missing"
          fi
          echo "=== Inject Installer Into RikkaHubApp ==="
          python3 << 'PYEOF'
          from pathlib import Path
          import re
          path = Path("app/src/main/java/me/rerere/rikkahub/RikkaHubApp.kt")
          if not path.exists():
              print("[WARN] RikkaHubApp.kt missing")
              exit(0)
          text = path.read_text(encoding="utf-8")
          call = " BundledSkillInstaller.install(this)"
          if call in text:
              print("[OK] installer already exists")
          else:
              pattern = r'(override fun onCreate\(\)\s*\{\s*super\.onCreate\(\))'
              if re.search(pattern, text):
                  text = re.sub(
                      pattern,
                      r'\1\n\n' + call,
                      text,
                      count=1
                  )
                  path.write_text(text, encoding="utf-8")
                  print("[OK] installer injected")
              else:
                  print("[WARN] onCreate marker not found")
          PYEOF
          echo "=== 4. Patch Default Assistants in PreferencesStore.kt ==="
          python3 << 'PYEOF'
          from pathlib import Path
          import re
          # 1. 允许删除默认助手 (解除 UI 限制)
          for path in Path("app/src/main/java").rglob("*.kt"):
              text = path.read_text(encoding="utf-8")
              if "DEFAULT_ASSISTANTS_IDS" in text:
                  print("[FOUND DEFAULT_ASSISTANTS_IDS]", path)
                  text = re.sub(
                      r'assistant\.id\s*!in\s*DEFAULT_ASSISTANTS_IDS',
                      'true',
                      text
                  )
                  path.write_text(text, encoding="utf-8")
                  print("[PATCHED] Unlocked delete button")
          # 2. 移除 DEFAULT_ASSISTANTS 里的第二个默认助手 (Gemini 预设)
          pref_path = Path("app/src/main/java/me/rerere/rikkahub/data/datastore/PreferencesStore.kt")
          if pref_path.exists():
              text = pref_path.read_text(encoding="utf-8")
              pattern = r'internal val DEFAULT_ASSISTANTS = listOf\([\s\S]*?\n\)'
              replacement = """internal val DEFAULT_ASSISTANTS = listOf(
              Assistant(
          id = DEFAULT_ASSISTANT_ID,
          name = "",
          systemPrompt = ""
                )
            )"""
              if re.search(pattern, text):
                  text = re.sub(pattern, replacement, text)
                  pref_path.write_text(text, encoding="utf-8")
                  print("[PATCHED] Trimmed DEFAULT_ASSISTANTS to 1 single assistant")
              else:
                  print("[WARN] DEFAULT_ASSISTANTS pattern not found in PreferencesStore.kt")
          PYEOF
          echo "=== Add R8 Keep Rules ==="
          touch app/proguard-rules.pro
          if ! grep -q "BundledSkillInstaller" app/proguard-rules.pro; then
            cat >> app/proguard-rules.pro << 'RULESEOF'
          # ===========================
          # Bundled Skills Installer
          # ===========================
          -keep class me.rerere.rikkahub.BundledSkillInstaller { *; }
          -keep class me.rerere.rikkahub.BundledSkillInstaller$* { *; }
          -keep class me.rerere.rikkahub.RikkaHubApp { *; }
          -keep class me.rerere.rikkahub.data.ai.tools.** { *; }
          RULESEOF
          fi
          echo "=== Verify Proguard Rules ==="
          grep -n "BundledSkillInstaller" app/proguard-rules.pro || true
          echo "=== Verify Installer Injection ==="
          grep -R "BundledSkillInstaller.install" \
            app/src/main/java/me/rerere/rikkahub/RikkaHubApp.kt || true
          echo "=== BundledSkillInstaller Patch Done ==="

      # Step 5.4: 检查上游是否已经修复 Gemini Schema
      - name: Check Gemini schema upstream fix
        if: steps.check_build.outputs.should_build == 'true'
        id: gemini_check
        shell: bash
        run: |
          set -e

          echo "=== Step 5.4: 检查 GoogleProvider.kt ==="

          FILE=$(find . \
            -type f \
            -name "GoogleProvider.kt" \
            -not -path "./.git/*" \
            | head -n 1)

          if [ -z "$FILE" ]; then
            echo "[ERROR] GoogleProvider.kt not found."
            echo "=== 搜索可能的 Google Provider 文件 ==="
            find . \
              -type f \
              -not -path "./.git/*" \
              | grep -Ei 'google.*provider|provider.*google' \
              | head -50 || true
            exit 1
          fi

          echo "[OK] GoogleProvider.kt:"
          echo "     $FILE"

          echo "google_provider_file=$FILE" >> "$GITHUB_OUTPUT"

          echo "=== 检查上游 Gemini Schema 修复 ==="

          # ------------------------------------------------------------
          # 情况 1：
          # 上游已经存在 sanitizeGeminiSchema
          # 说明上游已经包含兼容处理，完全跳过 5.5。
          # ------------------------------------------------------------
          if grep -q "sanitizeGeminiSchema" "$FILE"; then
            echo "[OK] 上游已存在 sanitizeGeminiSchema。"
            echo "[SKIP] 不执行本地 Gemini 补丁。"
            echo "need_gemini_patch=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # ------------------------------------------------------------
          # 情况 2：
          # 检查上游是否已经明确加入 items 处理。
          #
          # 这里不能简单 grep "items" 和 "array" 就认为修复，
          # 必须同时出现比较明确的 Schema 处理痕迹。
          # ------------------------------------------------------------
          if grep -Eq \
            '"items"|put[[:space:]]*\([[:space:]]*"items"|put[[:space:]]*\([[:space:]]*key[[:space:]]*=[[:space:]]*"items"' \
            "$FILE" \
            && \
            grep -Eq \
            '"array"|type.*array|array.*type|contentOrNull.*array' \
            "$FILE"; then

            echo "[OK] 检测到上游可能已经处理 array/items。"
            echo "[SKIP] 不执行本地 Gemini 补丁。"
            echo "need_gemini_patch=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # ------------------------------------------------------------
          # 情况 3：
          # 上游仍然是旧实现，需要执行 5.5。
          # ------------------------------------------------------------
          echo "[INFO] 上游尚未检测到 Gemini Schema 修复。"
          echo "[INFO] 需要执行 Step 5.5。"

          echo "need_gemini_patch=true" >> "$GITHUB_OUTPUT"

      # Step 5.5: Patch Gemini MCP schema compatibility
      - name: Patch Gemini MCP schema compatibility
        if: steps.check_build.outputs.should_build == 'true' && steps.gemini_check.outputs.need_gemini_patch == 'true'
        shell: bash
        env:
          GEMINI_PROVIDER_FILE: ${{ steps.gemini_check.outputs.google_provider_file }}
        run: |
          set -euo pipefail

          FILE="$GEMINI_PROVIDER_FILE"

          echo "=== Step 5.5: 修复 Gemini MCP Schema ==="
          echo "[INFO] 目标文件: $FILE"

          # ------------------------------------------------------------
          # 再次确认 5.4 找到的文件仍然存在
          # ------------------------------------------------------------
          if [ -z "$FILE" ]; then
            echo "[ERROR] Step 5.4 没有传递 GoogleProvider.kt 路径。"
            exit 1
          fi

          if [ ! -f "$FILE" ]; then
            echo "[ERROR] GoogleProvider.kt 不存在:"
            echo "$FILE"
            exit 1
          fi

          # ------------------------------------------------------------
          # 双重保护：
          # 如果上游在 5.4 之后已经存在 sanitizer，
          # 不再重复注入。
          # ------------------------------------------------------------
          if grep -q "sanitizeGeminiSchema" "$FILE"; then
            echo "[OK] Gemini sanitizer 已存在。"
            echo "[SKIP] 不重复修改。"
            exit 0
          fi

          echo "=== 开始定位 Gemini parameters Schema ==="

          python3 <<'PYEOF'
          from pathlib import Path
          import os
          import re

          file_path = os.environ.get("GEMINI_PROVIDER_FILE", "")

          if not file_path:
              raise SystemExit("[ERROR] GEMINI_PROVIDER_FILE is empty.")

          path = Path(file_path)

          if not path.exists():
              raise SystemExit(f"[ERROR] GoogleProvider.kt not found: {path}")

          text = path.read_text(encoding="utf-8")

          print(f"[INFO] Patching file: {path}")

          # ============================================================
          # 防止重复注入
          # ============================================================
          if "sanitizeGeminiSchema" in text:
              print("[OK] sanitizeGeminiSchema already exists.")
              raise SystemExit(0)

          # ============================================================
          # 定位原始 parameters 代码
          #
          # 不依赖具体缩进，只匹配代码结构。
          # ============================================================
          pattern = re.compile(
              r'''
              put\s*\(
             \s*key\s*=\s*"parameters"\s*,\s*
             element\s*=\s*
             json\.encodeToJsonElement\s*\(
                 \s*tool\.parameters\(\)\s*
             \)
             \s*
             \.removeElements\s*\(
                 \s*listOf\s*\(
                     \s*"const"\s*,\s*
                     \s*"exclusiveMaximum"\s*,\s*
                     \s*"exclusiveMinimum"\s*,\s*
                     \s*"format"\s*,\s*
                     \s*"additionalProperties"\s*,\s*
                     \s*"enum"\s*,?
                 \s*\)
             \s*\)
              \s*\)
              ''',
              re.VERBOSE | re.DOTALL,
          )

          match = pattern.search(text)

          if not match:
              raise SystemExit(
                  "[ERROR] Gemini parameters block not found.\n"
                  "上游 GoogleProvider.kt 结构已经发生变化。\n"
                  "为了避免错误修改，本次补丁已安全终止。"
              )

          print("[OK] Gemini parameters block found.")

          # ============================================================
          # 替换 parameters 生成逻辑
          # ============================================================
          replacement = '''put(
             key = "parameters",
             element = sanitizeGeminiSchema(
            json.encodeToJsonElement(tool.parameters())
                .removeElements(
                    listOf(
                        "const",
                        "exclusiveMaximum",
                        "exclusiveMinimum",
                        "format",
                        "additionalProperties",
                        "enum",
                     )
                 )
              )
          )'''

          text = text[:match.start()] + replacement + text[match.end():]

          print("[OK] Gemini parameters generation patched.")

          # ============================================================
          # 注入递归 Schema 修复函数
          #
          # 只修改：
          #
          # {
          #   "type": "array"
          # }
          #
          # 为：
          #
          # {
          #   "type": "array",
          #   "items": {
          #       "type": "string"
          #   }
          # }
          #
          # 已经存在 items 的 array 完全不修改。
          # ============================================================
          sanitizer = '''
          private fun sanitizeGeminiSchema(
             element: kotlinx.serialization.json.JsonElement
          ): kotlinx.serialization.json.JsonElement {
              return when (element) {
             is JsonObject -> {
            val map = element.toMutableMap()

            val type = (
                map["type"] as? JsonPrimitive
            )?.contentOrNull

            if (
                type == "array" &&
                !map.containsKey("items")
            ) {
                map["items"] = buildJsonObject {
                    put(
                        "type",
                        "string"
                    )
                }
            }

            JsonObject(
                map.mapValues { (_, value) ->
                    sanitizeGeminiSchema(value)
                     }
                 )
                  }

             is JsonArray -> {
            JsonArray(
                element.map { child ->
                    sanitizeGeminiSchema(child)
                               }
                         )
                  }

                       else -> element
                   }
               }
          '''

          # ============================================================
          # 找到 Kotlin 文件最后一个 }
          # ============================================================
          last_brace = text.rfind("}")

          if last_brace == -1:
              raise SystemExit("[ERROR] Cannot find class closing brace.")

          text = (
              text[:last_brace]
              + sanitizer
              + text[last_brace:]
          )

          # ============================================================
          # 写回文件
          # ============================================================
          path.write_text(text, encoding="utf-8")

          print("[OK] Gemini sanitizer injected successfully.")
          PYEOF

          echo "=== 验证 Gemini Schema 补丁 ==="

          if ! grep -q "sanitizeGeminiSchema" "$FILE"; then
            echo "[ERROR] sanitizeGeminiSchema 注入失败。"
            exit 1
          fi

          if ! grep -q "element = sanitizeGeminiSchema" "$FILE"; then
            echo "[ERROR] Gemini parameters 没有使用 sanitizer。"
            exit 1
          fi

          echo "[OK] Gemini Schema compatibility patch verified."
          echo "=== Step 5.5 完成 ==="

      # 谷歌兼容性检查结束
      - name: Verify Installer Before Build
        if: steps.check_build.outputs.should_build == 'true'
        run: |
          echo "=== Check Java Source ==="
          grep -R "class BundledSkillInstaller" app/src/main/java || true
          echo "=== Check Install Call ==="
          grep -R "BundledSkillInstaller.install" app/src/main/java || true
          echo "=== Check Proguard ==="
          grep -n "BundledSkillInstaller" app/proguard-rules.pro || true
          echo "=== Check UpdateChecker ==="
          grep -n "api.github.com/repos/klcb2010" app/src/main/java/me/rerere/rikkahub/utils/UpdateChecker.kt || echo "[WARN] UpdateChecker 未替换成功"

      # Step 6: 检查 Tag 和 Release 是否已存在
      - name: Check Existing Release
        if: steps.check_build.outputs.should_build == 'true'
        id: release_check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.version.outputs.tag_name }}"

          echo "Checking GitHub release status: $TAG"

          TAG_EXISTS=false
          RELEASE_EXISTS=false

          # 查询远程 Tag
          if gh api \
            "repos/${{ github.repository }}/git/ref/tags/$TAG" \
            >/dev/null 2>&1; then
            TAG_EXISTS=true
          fi

          # 查询 Release
          if gh api \
            "repos/${{ github.repository }}/releases/tags/$TAG" \
            >/dev/null 2>&1; then
            RELEASE_EXISTS=true
          fi

          echo "Tag exists: $TAG_EXISTS"
          echo "Release exists: $RELEASE_EXISTS"

          if [ "$TAG_EXISTS" = "true" ] && [ "$RELEASE_EXISTS" = "true" ]; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "Tag and Release already exist, skip build."
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "New release required."
          fi

      # Step 7: 编译未签名 Release APK
      - name: Build Release APK
        if: steps.check_build.outputs.should_build == 'true' && steps.release_check.outputs.should_release == 'true'
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      # Step 8: 自动创建 Git Tag 并推送
      - name: Create and Push Tag
        if: steps.check_build.outputs.should_build == 'true' && steps.release_check.outputs.should_release == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.version.outputs.tag_name }}"

          if gh api \
            "repos/${{ github.repository }}/git/ref/tags/$TAG" \
            >/dev/null 2>&1; then
            echo "Tag $TAG already exists, skip."
          else
            git tag "$TAG"
            git push origin "$TAG"
            echo "Tag $TAG pushed."
          fi

      # Step 9: 发布 GitHub Release 并上传 APK
      - name: Publish GitHub Release
        if: steps.check_build.outputs.should_build == 'true' && steps.release_check.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag_name }}
          name: RikkaHub ${{ steps.version.outputs.version_name }}
          draft: false
          prerelease: false
          body: |
            同步构建 `${{ steps.version.outputs.version_name }}`
          files: |
            app/build/outputs/apk/release/*.apk
