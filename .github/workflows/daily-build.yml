name: Daily Build

on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Local Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Configure Git Identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # Step 1: 备份保护文件，同步上游仓库并还原保护文件
      - name: Sync Upstream with Protected Files
        id: sync
        run: |
          set -e
          echo "=== Step 1: Backup protected files ==="
          mkdir -p /tmp/protected_backup

          # 备份要保护的文件和文件夹
          [ -f ".github/workflows/daily-build.yml" ] && cp --parents .github/workflows/daily-build.yml /tmp/protected_backup/ || true
          [ -f "README.md" ] && cp --parents README.md /tmp/protected_backup/ || true
          [ -f "build.gradle.kts" ] && cp --parents build.gradle.kts /tmp/protected_backup/ || true
          [ -f "app/google-services.json" ] && cp --parents app/google-services.json /tmp/protected_backup/ || true
          [ -d "mod" ] && cp -r mod /tmp/protected_backup/ || true

          echo "=== Fetching and merging upstream ==="
          git remote add upstream https://github.com/rikkahub/rikkahub.git || true
          git fetch upstream master || git fetch upstream main

          # 尝试合并上游 master/main
          UPSTREAM_BRANCH="upstream/master"
          git rev-parse --verify "$UPSTREAM_BRANCH" >/dev/null 2>&1 || UPSTREAM_BRANCH="upstream/main"
          
          git merge "$UPSTREAM_BRANCH" --no-commit --no-ff -X ours || true

          echo "=== Restoring protected files ==="
          [ -f "/tmp/protected_backup/.github/workflows/daily-build.yml" ] && cp /tmp/protected_backup/.github/workflows/daily-build.yml .github/workflows/daily-build.yml || true
          [ -f "/tmp/protected_backup/README.md" ] && cp /tmp/protected_backup/README.md README.md || true
          [ -f "/tmp/protected_backup/build.gradle.kts" ] && cp /tmp/protected_backup/build.gradle.kts build.gradle.kts || true
          [ -f "/tmp/protected_backup/app/google-services.json" ] && cp /tmp/protected_backup/app/google-services.json app/google-services.json || true
          if [ -d "/tmp/protected_backup/mod" ]; then
            rm -rf mod
            cp -r /tmp/protected_backup/mod mod
          fi

          # 提交同步结果
          git add .
          if ! git diff --staged --quiet; then
            git commit -m "sync: merge upstream with protected local files"
            git push origin master || git push origin main
            echo "has_sync_changes=true" >> $GITHUB_OUTPUT
          else
            echo "No new changes from upstream merge."
            echo "has_sync_changes=false" >> $GITHUB_OUTPUT
          fi

      # Step 2: 获取版本号与 Tag 判定
      - name: Extract Version Name & Check Tag
        id: version
        run: |
          VERSION_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts || echo "2.4.5")
          TAG_NAME="v${VERSION_NAME}"
          echo "version_name=${VERSION_NAME}" >> $GITHUB_OUTPUT
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT

          # 检查标签是否已存在
          if git rev-parse "$TAG_NAME" >/dev/null 2>&1 || git ls-remote --tags origin | grep -q "refs/tags/${TAG_NAME}"; then
            echo "tag_exists=true" >> $GITHUB_OUTPUT
            echo "Tag ${TAG_NAME} already exists."
          else
            echo "tag_exists=false" >> $GITHUB_OUTPUT
            echo "New Tag ${TAG_NAME} will be created."
          fi

      # Step 3: 确定是否继续编译 (如无更新且标签已存在，且非手动触发则跳过)
      - name: Check Should Build
        id: check_build
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ steps.version.outputs.tag_exists }}" = "false" ] || [ "${{ steps.sync.outputs.has_sync_changes }}" = "true" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "无新提交且版本号标签未更新，跳过构建。"
          fi

      # ---- 如果需要构建，进入构建准备环境 ----
      - name: Set up JDK 17
        if: steps.check_build.outputs.should_build == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up pnpm
        if: steps.check_build.outputs.should_build == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node 22
        if: steps.check_build.outputs.should_build == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web-ui/pnpm-lock.yaml

      - name: Install web-ui dependencies
        if: steps.check_build.outputs.should_build == 'true'
        working-directory: web-ui
        run: pnpm install --frozen-lockfile

      - name: Gradle cache
        if: steps.check_build.outputs.should_build == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      # Step 4: 移除 BaselineProfile 模块 (解决 com.android.test 插件冲突)
      - name: Remove BaselineProfile Module
        if: steps.check_build.outputs.should_build == 'true'
        run: |
          echo "=== Disabling BaselineProfile Module ==="
          sed -i '/include(":app:baselineprofile")/d' settings.gradle.kts || true
          sed -i '/baselineProfile(project(":app:baselineprofile"))/d' app/build.gradle.kts || true
          sed -i '/alias(libs\.plugins\.baselineprofile)/d' app/build.gradle.kts || true
          sed -i '/alias(libs\.plugins\.baselineprofile)/d' build.gradle.kts || true
          sed -i '/alias(libs\.plugins\.android\.test)/d' build.gradle.kts || true
          echo "[OK] BaselineProfile disabled."

      # Step 5: 修改 app/build.gradle.kts 与注入所有 Custom Mods
      - name: Modify app/build.gradle.kts & Apply Custom Mods
        if: steps.check_build.outputs.should_build == 'true'
        run: |
          echo "=== 1. Modifying app/build.gradle.kts with Python ==="
          python3 - << 'EOF'
          import re

          gradle_path = "app/build.gradle.kts"
          with open(gradle_path, "r", encoding="utf-8") as f:
              content = f.read()

          # 1. plugins 中的删除
          content = re.sub(r'\s*alias\(libs\.plugins\.google\.services\)', '', content)
          content = re.sub(r'\s*alias\(libs\.plugins\.firebase\.crashlytics\)', '', content)

          # 2. splits 中的删除注释
          content = re.sub(r'\s*// AppBundle tasks usually contain "bundle" in their name', '', content)
          content = re.sub(r'\s*//noinspection WrongGradleMethod', '', content)

          # 3. signingConfigs 整段删除
          content = re.sub(r'\s*signingConfigs\s*\{[\s\S]*?\n    \}', '', content)

          # 4. buildTypes 中的删除与增加 (强制设定为 false)
          content = re.sub(r'\s*signingConfig\s*=\s*signingConfigs\.getByName\("release"\)', '', content)
          content = re.sub(r'\s*optimization\s*\{[\s\S]*?\}', '', content)
          
          # 确保 isMinifyEnabled = false 与 isShrinkResources = false 存在
          if "isMinifyEnabled" not in content:
              content = re.sub(r'(release\s*\{)', r'\1\n            isMinifyEnabled = false\n            isShrinkResources = false', content)
          else:
              content = re.sub(r'isMinifyEnabled\s*=\s*true', 'isMinifyEnabled = false', content)
              content = re.sub(r'isShrinkResources\s*=\s*true', 'isShrinkResources = false', content)

          # 5. sourceSets 整段删除
          content = re.sub(r'\s*sourceSets\s*\{[\s\S]*?\n    \}', '', content)

          # 6. // Firebase 整段删除
          content = re.sub(r'\s*// Firebase', '', content)
          content = re.sub(r'\s*implementation\(platform\(libs\.firebase\.bom\)\)', '', content)
          content = re.sub(r'\s*implementation\(libs\.firebase\.analytics\)', '', content)
          content = re.sub(r'\s*implementation\(libs\.firebase\.crashlytics\)', '', content)

          with open(gradle_path, "w", encoding="utf-8") as f:
              f.write(content)

          print("[OK] app/build.gradle.kts modified successfully.")
          EOF

          echo "=== 2. Deep Cleaning Firebase Code Residues ==="
          # 代码中清除 Firebase
          find app/src/main/java -name "*.kt" -exec sed -i '/import com\.google\.firebase/d' {} + || true
          find app/src/main/java -name "*.kt" -exec sed -i '/FirebaseAnalytics/d' {} + || true
          find app/src/main/java -name "*.kt" -exec sed -i '/Firebase/d' {} + || true
          find app/src/main/java -name "*.kt" -exec sed -i 's/, private val analytics: FirebaseAnalytics//g' {} + || true
          find app/src/main/java -name "*.kt" -exec sed -i 's/private val analytics: FirebaseAnalytics,//g' {} + || true
          find app/src/main/java -name "*.kt" -exec sed -i '/analytics\.logEvent/d' {} + || true
          
          # 移除 Koin AppModule 里的 Firebase 注入块
          find app/src/main/java/me/rerere/rikkahub/di -name "*.kt" -exec sed -i '/Firebase/d' {} + || true
          find app/src/main/java/me/rerere/rikkahub/di -name "*.kt" -exec perl -i -0777 -pe 's/single\s*\{\s*\}//gs' {} + || true
          find app/src/main/java/me/rerere/rikkahub/di -name "*.kt" -exec perl -i -0777 -pe 's/viewModel\s*\{\s*\}//gs' {} + || true
          find app/src/main/java/me/rerere/rikkahub/di -name "*.kt" -exec sed -i '/analytics\s*=/d' {} + || true

          echo "=== 3. Restoring Assistant deletable property ==="
          # 在 Assistant 数据类中注入 deletable 属性以支持解锁
          ASSISTANT_MODEL="app/src/main/java/me/rerere/rikkahub/data/model/Assistant.kt"
          if [ -f "$ASSISTANT_MODEL" ]; then
            sed -i 's/val allowConversationPromptInjection: Boolean = false,/val allowConversationPromptInjection: Boolean = false,\n    val deletable: Boolean = true,/g' "$ASSISTANT_MODEL" || true
            sed -i 's/val allowConversationPromptInjection: Boolean = false/val allowConversationPromptInjection: Boolean = false,\n    val deletable: Boolean = true/g' "$ASSISTANT_MODEL" || true
            echo "[OK] deletable property injected into Assistant.kt"
          fi

          echo "=== 4. Restoring AssistantPage delete button unlock ==="
          # 强开删除按钮 UI 显示 (破解 !in 语法)
          ASSISTANT_PAGE="app/src/main/java/me/rerere/rikkahub/ui/pages/assistant/AssistantPage.kt"
          if [ -f "$ASSISTANT_PAGE" ]; then
            sed -i 's/if (assistant\.id !in DEFAULT_ASSISTANTS_IDS) {/if (true) {/g' "$ASSISTANT_PAGE" || true
            echo "[OK] Delete button unlocked in AssistantPage.kt"
          fi

          echo "=== 5. Restoring double-delete fix (PreferencesStore.kt) ==="
          # 清除自动加回默认助手的复活逻辑，实现一键彻底删除
          PREF_STORE="app/src/main/java/me/rerere/rikkahub/data/datastore/PreferencesStore.kt"
          if [ -f "$PREF_STORE" ]; then
            sed -i 's/ifEmpty { DEFAULT_ASSISTANTS }/ifEmpty { emptyList() }/g' "$PREF_STORE" || true
            sed -i 's/DEFAULT_ASSISTANTS\.forEach/emptyList<me.rerere.rikkahub.data.model.Assistant>().forEach/g' "$PREF_STORE" || true
            echo "[OK] Respawn logic neutralized in PreferencesStore.kt"
          fi

          echo "=== 6. Copying Builtin Skills & Installer ==="
          # 复制 skills 包和安装器到对应资产目录
          mkdir -p app/src/main/assets/skills
          [ -d "mod/skills" ] && cp -r mod/skills/* app/src/main/assets/skills/ || true
          if [ -f "mod/BundledSkillInstaller.java" ]; then
            mkdir -p app/src/main/java/me/rerere/rikkahub
            cp mod/BundledSkillInstaller.java app/src/main/java/me/rerere/rikkahub/
            sed -i '/super\.onCreate()/a \        me.rerere.rikkahub.BundledSkillInstaller.install(this)' app/src/main/java/me/rerere/rikkahub/RikkaHubApp.kt || true
          fi

          echo "=== 7. Applying Skills bypass & forced logic ==="
          # 强开所有后台技能 (ChatService.kt & SkillsTools.kt)
          [ -f "app/src/main/java/me/rerere/rikkahub/service/ChatService.kt" ] && sed -i 's/assistant\.enabledSkills\.isNotEmpty()/true/g' "app/src/main/java/me/rerere/rikkahub/service/ChatService.kt" || true
          [ -f "app/src/main/java/me/rerere/rikkahub/data/ai/tools/SkillsTools.kt" ] && sed -i 's/val available = allSkills\.filter {.*}/val available = allSkills/g' "app/src/main/java/me/rerere/rikkahub/data/ai/tools/SkillsTools.kt" || true

          # 综合 Proguard 混淆保护规则
          cat >> app/proguard-rules.pro <<EOF
          -keep class me.rerere.rikkahub.BundledSkillInstaller { *; }
          -keep class me.rerere.rikkahub.data.files.SkillMetadata { *; }
          -keep class me.rerere.rikkahub.data.model.Assistant { *; }
          -keepclassmembers class me.rerere.rikkahub.data.model.Assistant { *; }
          EOF

      # Step 6: 编译未签名 Release APK
      - name: Build Release APK
        if: steps.check_build.outputs.should_build == 'true'
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      # Step 7: 自动创建 Git Tag 并推送
      - name: Create and Push Tag
        if: steps.check_build.outputs.should_build == 'true'
        run: |
          TAG="${{ steps.version.outputs.tag_name }}"
          git tag "$TAG" || true
          git push origin "$TAG" || true
          echo "Tag $TAG pushed."

      # Step 8: 发布 Release 并上传未签名 APK
      - name: Publish GitHub Release
        if: steps.check_build.outputs.should_build == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag_name }}
          name: RikkaHub ${{ steps.version.outputs.version_name }}
          draft: false
          prerelease: false
          body: |
            自动同步构建版 `${{ steps.version.outputs.version_name }}`
            Commit: `${{ github.sha }}`
          files: app/build/outputs/apk/release/*.apk
