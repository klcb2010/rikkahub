name: Daily Build

on:
  # 每天 UTC 18:00 触发（北京时间次日 02:00），可按需修改
  schedule:
    - cron: '0 18 * * *'
  # 也支持手动触发
  workflow_dispatch:

jobs:
  # 检查过去 24 小时内是否有新提交，没有则跳过构建，避免重复打包
  check:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
    steps:
      - uses: actions/checkout@v4
      - name: Check for recent commits
        id: check
        run: |
          # 手动触发时无条件构建
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # 定时触发：仅当过去 24 小时内有新提交才构建
          if [ -n "$(git log --since='24 hours ago' --oneline)" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "过去 24 小时无新提交，跳过构建"
          fi

  build:
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 发布 Release 需要写权限

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive # 拉取子模块

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # web 模块的 preBuild 会执行 `pnpm run build` 构建前端，必须准备好 Node + pnpm
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web-ui/pnpm-lock.yaml

      # gradle 的 buildWebUi 任务只跑 build 不跑 install，需在此提前安装依赖
      - name: Install web-ui dependencies
        working-directory: web-ui
        run: pnpm install --frozen-lockfile

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Apply custom mods
        run: |
          echo "Start applying mods from /mod directory"
          
          # 1. 复制技能包到 assets
          mkdir -p app/src/main/assets/skills
          cp -r mod/skills/* app/src/main/assets/skills/ || true
          echo "Skills copied to assets/skills/"
          
          # 2. 复制 BundledSkillInstaller.java 到源码目录
          # 注意包名 me.rerere.rikkahub
          mkdir -p app/src/main/java/me/rerere/rikkahub
          cp mod/BundledSkillInstaller.java app/src/main/java/me/rerere/rikkahub/ || true
          echo "BundledSkillInstaller.java copied"
          
          # 3. 修改 RikkaHubApp.kt，在 super.onCreate() 后插入安装调用
          RIKKA_APP="app/src/main/java/me/rerere/rikkahub/RikkaHubApp.kt"
          if [ -f "$RIKKA_APP" ]; then
            # 避免重复插入
            if ! grep -q "BundledSkillInstaller.install" "$RIKKA_APP"; then
              sed -i '/super\.onCreate()/a \        me.rerere.rikkahub.BundledSkillInstaller.install(this)' "$RIKKA_APP"
              echo "Injected BundledSkillInstaller.install into RikkaHubApp.kt"
            else
              echo "BundledSkillInstaller.install already exists, skip"
            fi
          else
            echo "Warning: RikkaHubApp.kt not found"
          fi
          
          # 4. 修改 ChatService.kt，强制默认启用全部技能
          # 找到 getEnabledSkills() 的第二个调用，把上面的 if 判断改成无条件执行
          CHAT_SERVICE="app/src/main/java/me/rerere/rikkahub/data/ai/ChatService.kt"
          if [ -f "$CHAT_SERVICE" ]; then
            # 策略：找到 getEnabledSkills，然后往上找最近的 if/ when，把条件改为 true
            # 这个正则把 `if (xxx) {` 替换成 `if (true) {`，只作用于 getEnabledSkills 上面5行内
            awk '/getEnabledSkills\(\)/{n=NR} n && NR>=n-5 && NR<=n && /if \(/ {sub(/if \(.*\)/, "if (true)")} 1' "$CHAT_SERVICE" > "$CHAT_SERVICE.tmp" && mv "$CHAT_SERVICE.tmp" "$CHAT_SERVICE"
            echo "Patched ChatService.kt to always load all skills"
          else
            echo "Warning: ChatService.kt not found"
          fi
          
          # 5. 修改 SkillsToolsKt.kt，删除 contains 过滤逻辑
          # 策略：删掉 `if (!xxx.contains(skill)) continue` 这种行
          SKILLS_TOOLS="app/src/main/java/me/rerere/rikkahub/data/ai/tools/SkillsToolsKt.kt"
          if [ -f "$SKILLS_TOOLS" ]; then
            sed -i '/\.contains(/d' "$SKILLS_TOOLS"
            echo "Removed .contains filter in SkillsToolsKt.kt"
          else
            echo "Warning: SkillsToolsKt.kt not found"
          fi
          
          # 6. 防止 R8 误删技能类
          echo "-keep class me.rerere.rikkahub.BundledSkillInstaller { *; }" >> app/proguard-rules.pro
          echo "Added proguard rule for BundledSkillInstaller"
          
          echo "Mod apply done"

      - name: Prepare build files
        run: |
          # 解码base64编码的keystore文件
          echo "${{ secrets.KEY_BASE64 }}" | base64 -d > app/app.key

          # 写入签名配置到local.properties
          echo "${{ secrets.SIGNING_CONFIG }}" > local.properties

          # 写入Google Services配置
          echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > app/google-services.json

      - name: Gradle Build
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      # 把 APK 直接发布为 Prerelease，用户点链接即可下载单个 apk，无需登录、无需解压
      - name: Publish nightly prerelease
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: nightly            # 固定 tag，每晚覆盖同一个「最新每日构建」
          name: Nightly Build
          prerelease: true
          body: |
            自动每日构建（commit `${{ github.sha }}`）
            
            Mod: 内置 /assets/skills 技能包，默认启用全部技能
            
            > ⚠ 开发版本，可能不稳定，仅供测试。
          files: app/build/outputs/apk/release/*.apk
