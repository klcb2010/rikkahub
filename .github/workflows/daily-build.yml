name: Daily Build

on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
    steps:
      - uses: actions/checkout@v4
      - name: Check for recent commits
        id: check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -n "$(git log --since='24 hours ago' --oneline)" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "过去 24 小时无新提交，跳过构建"
          fi

  build:
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web-ui/pnpm-lock.yaml

      - name: Install web-ui dependencies
        working-directory: web-ui
        run: pnpm install --frozen-lockfile

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Apply custom mods
        run: |
          set -e
          echo "=== Applying custom mods ==="

          # 1. 开启 R8 代码压缩与优化（实现 7 DEX 变 3 DEX）
          GRADLE_FILE="app/build.gradle.kts"
          if [ -f "$GRADLE_FILE" ]; then
            sed -i '/release {/,/}/s/isMinifyEnabled = false/isMinifyEnabled = true/' "$GRADLE_FILE"
            sed -i '/release {/,/}/s/isShrinkResources = false/isShrinkResources = true/' "$GRADLE_FILE"
            echo "[OK] Enabled R8 Minify & Shrink in app/build.gradle.kts"
          fi

          # 2. 修改 ChatService.kt：强制注入所有技能
          CHAT_FILE="app/src/main/java/me/rerere/rikkahub/service/ChatService.kt"
          if [ -f "$CHAT_FILE" ]; then
            sed -i 's/assistant\.enabledSkills\.isNotEmpty()/true/g' "$CHAT_FILE"
            echo "[OK] Patched ChatService.kt: forced skill entry"
          fi

          # 3. 修改 SkillsTools.kt：解除 enabledSkills 过滤限制
          SKILL_TOOLS="app/src/main/java/me/rerere/rikkahub/data/ai/tools/SkillsTools.kt"
          if [ -f "$SKILL_TOOLS" ]; then
            sed -i 's/val available = allSkills\.filter {.*}/val available = allSkills/g' "$SKILL_TOOLS"
            echo "[OK] Patched SkillsTools.kt: bypassed filter"
          fi

          # 4. 移除 Firebase
          sed -i '/id("com\.google\.gms\.google-services")/d' app/build.gradle.kts || true
          sed -i '/libs\.firebase/d' app/build.gradle.kts || true
          sed -i '/firebase/d' gradle/libs.versions.toml || true
          sed -i '/google-services/d' gradle/libs.versions.toml || true
          sed -i '/libs\.plugins\.google/d' build.gradle.kts || true
          sed -i '/libs\.plugins\.firebase/d' build.gradle.kts || true

          find app/src/main/java -type f -name "*.kt" -exec sed -i '/import com\.google\.firebase/d' {} + || true
          find app/src/main/java -type f -name "*.kt" -exec sed -i 's/, private val analytics: FirebaseAnalytics//' {} + || true
          find app/src/main/java -type f -name "*.kt" -exec sed -i '/analytics\.logEvent/d' {} + || true
          find app/src/main/java -type f -name "*.kt" -exec sed -i '/Firebase/d' {} + || true
          find app/src/main/java -type f -name "*.kt" -exec sed -i '/FirebaseAnalytics/d' {} + || true

          sed -i '/single.*Firebase/,/}/d' app/src/main/java/me/rerere/rikkahub/di/AppModule.kt || true
          sed -i '/single.*Crashlytics/,/}/d' app/src/main/java/me/rerere/rikkahub/di/AppModule.kt || true

          VIEWMODEL_MODULE="app/src/main/java/me/rerere/rikkahub/di/ViewModelModule.kt"
          if [ -f "$VIEWMODEL_MODULE" ]; then
            sed -i '/Firebase/d' "$VIEWMODEL_MODULE" || true
            sed -i '/analytics\s*=/d' "$VIEWMODEL_MODULE" || true
            echo "[OK] Removed Firebase analytics injection"
          fi
          echo "[OK] Firebase removed"

          # 5. 技能包塞进 assets
          mkdir -p app/src/main/assets/skills
          [ -d "mod/skills" ] && cp -r mod/skills/* app/src/main/assets/skills/

          # 6. 复制 BundledSkillInstaller.java
          [ -f "mod/BundledSkillInstaller.java" ] && cp mod/BundledSkillInstaller.java app/src/main/java/me/rerere/rikkahub/BundledSkillInstaller.java

          # 7. 改 RikkaHubApp.kt 插入 install 调用
          APP_FILE="app/src/main/java/me/rerere/rikkahub/RikkaHubApp.kt"
          [ -f "$APP_FILE" ] && sed -i '/super\.onCreate()/a \        me.rerere.rikkahub.BundledSkillInstaller.install(this)' "$APP_FILE"

          # 8. 修复 baselineprofile
          [ -f "app/baselineprofile/build.gradle.kts" ] && sed -i 's/id("com.android.test") version "[^"]*"/id("com.android.test")/' app/baselineprofile/build.gradle.kts

          # 9. Keep 规则
          echo -e "\n-keep class me.rerere.rikkahub.BundledSkillInstaller { *; }" >> app/proguard-rules.pro
          echo "-keep class me.rerere.rikkahub.data.files.SkillMetadata { *; }" >> app/proguard-rules.pro

          # 10. 修改 Assistant.kt 注入 deletable 属性
          ASSISTANT_MODEL="app/src/main/java/me/rerere/rikkahub/data/model/Assistant.kt"
          if [ -f "$ASSISTANT_MODEL" ]; then
            sed -i 's/val allowConversationPromptInjection: Boolean = false/val allowConversationPromptInjection: Boolean = false,\n    val deletable: Boolean = true/g' "$ASSISTANT_MODEL"
            echo "[OK] Injected 'deletable' property"
          fi

          # 11. 强开助手删除按钮 (AssistantPage.kt)
          ASSISTANT_PAGE="app/src/main/java/me/rerere/rikkahub/ui/pages/assistant/AssistantPage.kt"
          if [ -f "$ASSISTANT_PAGE" ]; then
            sed -i 's/assistant\.id !in DEFAULT_ASSISTANTS_IDS/true/g' "$ASSISTANT_PAGE"
            sed -i 's/it\.id !in DEFAULT_ASSISTANTS_IDS/true/g' "$ASSISTANT_PAGE"
            echo "[OK] Patched AssistantPage.kt: Force-enabled Delete"
          fi

          # 12. 强开技能开关点亮效果 (SkillsPage.kt)
          SKILLS_PAGE="app/src/main/java/me/rerere/rikkahub/ui/pages/extensions/skills/SkillsPage.kt"
          if [ -f "$SKILLS_PAGE" ]; then
            sed -i 's/checked = .*\.contains(skill\.name)/checked = true/g' "$SKILLS_PAGE"
            sed -i 's/checked = .*\.contains(it\.name)/checked = true/g' "$SKILLS_PAGE"
            echo "[OK] Patched SkillsPage.kt: Forced switches to true"
          fi

          # 13. 保留 Assistant 类
          echo "-keep class me.rerere.rikkahub.data.model.Assistant { *; }" >> app/proguard-rules.pro
          echo "=== Mod apply done ==="

      - name: Build Release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rikkahub-release
          path: app/build/outputs/apk/release/app-release.apk

      - name: Publish nightly prerelease
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: nightly
          name: Nightly Build
          prerelease: true
          body: |
            自动每日构建 `${{ github.sha }}`
            Mod: 内置 skills + 强制启用全部技能 + 强开助手删除按钮 (含 DEX 精简合并)
          files: app/build/outputs/apk/release/*.apk
