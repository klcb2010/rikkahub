name: Daily Build

on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
    steps:
      - uses: actions/checkout@v4
      - name: Check for recent commits
        id: check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -n "$(git log --since='24 hours ago' --oneline)" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "过去 24 小时无新提交，跳过构建"
          fi

  build:
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web-ui/pnpm-lock.yaml

      - name: Install web-ui dependencies
        working-directory: web-ui
        run: pnpm install --frozen-lockfile

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Apply custom mods
        run: |
          set -e
          echo "=== Applying mods from /mod ==="

          # 1. 技能包塞进 assets
          mkdir -p app/src/main/assets/skills
          if [ -d "mod/skills" ]; then
            cp -r mod/skills/* app/src/main/assets/skills/
            echo "[OK] Skills copied to assets/skills/"
          fi

          # 2. 复制 BundledSkillInstaller.java
          INSTALLER_PATH="app/src/main/java/me/rerere/rikkahub/BundledSkillInstaller.java"
          if [ -f "mod/BundledSkillInstaller.java" ]; then
            mkdir -p app/src/main/java/me/rerere/rikkahub
            cp mod/BundledSkillInstaller.java "$INSTALLER_PATH"
            echo "[OK] BundledSkillInstaller.java copied"
          fi

          # 3. 改 RikkaHubApp.kt: super.onCreate() 后插入 install 调用
          APP_FILE="app/src/main/java/me/rerere/rikkahub/RikkaHubApp.kt"
          if [ -f "$APP_FILE" ]; then
            if ! grep -q "BundledSkillInstaller.install" "$APP_FILE"; then
              sed -i '/super\.onCreate()/a \ me.rerere.rikkahub.BundledSkillInstaller.install(this)' "$APP_FILE"
              echo "[OK] Injected install() into RikkaHubApp.kt"
            else
              echo "[Skip] install() already exists in RikkaHubApp.kt"
            fi
          fi

          # 4. 改 ChatService.kt: 强制默认启用全部技能
          CHAT_FILE="app/src/main/java/me/rerere/rikkahub/data/ai/ChatService.kt"
          if [ -f "$CHAT_FILE" ]; then
            LINE_NUM=$(grep -n "getEnabledSkills()" "$CHAT_FILE" | sed -n '2p' | cut -d: -f1)
            if [ -n "$LINE_NUM" ]; then
              START=$((LINE_NUM - 10))
              sed -i "${START},${LINE_NUM}s/if\s*(.*)/if (true)/" "$CHAT_FILE"
              echo "[OK] Patched ChatService.kt at line ~$LINE_NUM to bypass skill check"
            else
              echo "[Warn] getEnabledSkills() not found twice in ChatService.kt"
            fi
          fi

          # 5. 改 SkillsToolsKt.kt: 删掉 contains 过滤
          SKILL_TOOLS="app/src/main/java/me/rerere/rikkahub/data/ai/tools/SkillsToolsKt.kt"
          if [ -f "$SKILL_TOOLS" ]; then
            sed -i '/\.contains(/d' "$SKILL_TOOLS"
            echo "[OK] Removed.contains() filter in SkillsToolsKt.kt"
          fi

          # 6. 防 R8 误删
          echo -e "\n-keep class me.rerere.rikkahub.BundledSkillInstaller { *; }" >> app/proguard-rules.pro
          echo "[OK] Added proguard keep rule"

          echo "=== Mod apply done ==="

      - name: Prepare build files
        run: |
          # 解码base64编码的keystore文件
          echo "${{ secrets.KEY_BASE64 }}" | base64 -d > app/app.key

          # 写入签名配置到local.properties
          echo "${{ secrets.SIGNING_CONFIG }}" > local.properties



      - name: Gradle Build
        run: |
          chmod +x gradlew
            ./gradlew assembleRelease

      - name: Publish nightly prerelease
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: nightly
          name: Nightly Build
          prerelease: true
          body: |
            自动每日构建 `${{ github.sha }}`
            Mod: 内置 skills + 强制启用全部技能
          files: app/build/outputs/apk/release/*.apk
